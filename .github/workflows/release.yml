name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match release tag to source
        id: source
        shell: pwsh
        run: |
          $source = Get-Content src/App.cs -Raw
          $version = [regex]::Match($source, 'const string Version="([0-9.]+)"').Groups[1].Value
          $matches = $env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -eq "v$version"
          "matches=$($matches.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $matches) { Write-Output 'Historical binary archive tag: no matching source snapshot to rebuild.' }
      - name: Install NSIS compiler
        if: steps.source.outputs.matches == 'true'
        shell: powershell
        run: choco install nsis --yes --no-progress
      - name: Build Windows installer
        if: steps.source.outputs.matches == 'true'
        shell: powershell
        run: ./build.ps1 -OutputDirectory dist/release
      - uses: actions/upload-artifact@v4
        if: steps.source.outputs.matches == 'true'
        with:
          name: MultiVPNConnect-Windows
          path: |
            dist/release/MultiVPNConnect.exe
            dist/release/MultiVPNConnect-Setup.exe
            dist/release/SHA256SUMS.txt
      - name: Publish draft release
        if: startsWith(github.ref, 'refs/tags/') && steps.source.outputs.matches == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --json id 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output 'Release already exists; keeping its published assets.'
            exit 0
          }
          gh release create $env:GITHUB_REF_NAME dist/release/MultiVPNConnect-Setup.exe dist/release/SHA256SUMS.txt --draft --generate-notes
