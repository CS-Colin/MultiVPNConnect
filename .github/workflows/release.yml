name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NSIS compiler
        shell: powershell
        run: choco install nsis --yes --no-progress
      - name: Build Windows installer
        shell: powershell
        run: ./build.ps1 -OutputDirectory dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: MultiVPNConnect-Windows
          path: |
            dist/release/MultiVPNConnect.exe
            dist/release/MultiVPNConnect-Setup.exe
            dist/release/SHA256SUMS.txt
      - name: Publish draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --json id 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output 'Release already exists; keeping its published assets.'
            exit 0
          }
          gh release create $env:GITHUB_REF_NAME dist/release/MultiVPNConnect-Setup.exe dist/release/SHA256SUMS.txt --draft --generate-notes
