name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows binaries
        shell: powershell
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MultiVPNConnect-Windows
          path: dist/0.3.0/*
      - name: Publish draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --json id 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output 'Release already exists; keeping its published assets.'
            exit 0
          }
          gh release create $env:GITHUB_REF_NAME dist/0.3.0/MultiVPNConnect-Setup.exe dist/0.3.0/SHA256SUMS.txt --draft --generate-notes
